# Keep-alive: pings the agent API every 10 minutes so the free Render
# instance (which sleeps after 15 min idle) stays warm during evaluation.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /health
        run: |
          curl -s --max-time 120 --retry 3 https://rankforge-qx8p.onrender.com/health || echo "health ping timed out (ignored)"
